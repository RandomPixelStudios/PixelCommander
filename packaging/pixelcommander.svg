<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d95ff"/>
      <stop offset="1" stop-color="#1550c0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eef9"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8a317"/>
      <stop offset="1" stop-color="#d18b0c"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd767"/>
      <stop offset="1" stop-color="#f7bd34"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#tile)" filter="url(#shadow)"/>
  <path d="M18 4h28a14 14 0 0 1 14 14v6H4v-6A14 14 0 0 1 18 4z" fill="url(#gloss)"/>

  <!-- two file panels -->
  <g filter="url(#shadow)">
