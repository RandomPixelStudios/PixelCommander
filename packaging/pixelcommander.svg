    <rect x="33.5" y="12" width="20.5" height="34" rx="4" fill="url(#panel)"/>
  </g>
  <!-- left panel: folder + rows, one selected -->
  <path d="M13.5 17.3a1.3 1.3 0 0 1 1.3-1.3h2.6l1.1 1.1h3.4a1.3 1.3 0 0 1 1.3 1.3v3.3a1.3 1.3 0 0 1-1.3 1.3h-7.1a1.3 1.3 0 0 1-1.3-1.3z" fill="url(#back)"/>
  <path d="M13.5 18.9a1.3 1.3 0 0 1 1.3-1.3h7.9a1.3 1.3 0 0 1 1.3 1.3v2.8a1.3 1.3 0 0 1-1.3 1.3h-7.9a1.3 1.3 0 0 1-1.3-1.3z" fill="url(#front)"/>
  <rect x="12" y="26" width="16.5" height="4.4" rx="1.4" fill="#cfe2ff"/>
  <g fill="#9aa9bd">
