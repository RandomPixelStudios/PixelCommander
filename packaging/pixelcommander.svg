    <rect x="34.45" y="43.15" width="1.9" height="1.9" rx="0.35"/>
    <rect x="34.45" y="46.95" width="1.9" height="1.9" rx="0.35"/>
    <rect x="32.55" y="41.25" width="1.9" height="1.9" rx="0.35"/>
