    <rect x="13.5" y="33" width="9" height="1.6" rx="0.8"/>
    <rect x="13.5" y="37.5" width="11" height="1.6" rx="0.8"/>
  </g>
  <!-- right panel: rows -->
  <path d="M37 17.3a1.3 1.3 0 0 1 1.3-1.3h2.6l1.1 1.1h3.4a1.3 1.3 0 0 1 1.3 1.3v3.3a1.3 1.3 0 0 1-1.3 1.3h-7.1a1.3 1.3 0 0 1-1.3-1.3z" fill="url(#back)"/>
  <path d="M37 18.9a1.3 1.3 0 0 1 1.3-1.3h7.9a1.3 1.3 0 0 1 1.3 1.3v2.8a1.3 1.3 0 0 1-1.3 1.3h-7.9a1.3 1.3 0 0 1-1.3-1.3z" fill="url(#front)"/>
  <g fill="#9aa9bd">
    <rect x="37" y="27.4" width="10" height="1.6" rx="0.8"/>
    <rect x="37" y="33" width="12" height="1.6" rx="0.8"/>
    <rect x="37" y="37.5" width="8" height="1.6" rx="0.8"/>
  </g>

